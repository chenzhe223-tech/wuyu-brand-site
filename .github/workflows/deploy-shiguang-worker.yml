name: Deploy SHIGUANG AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "shiguang/worker/**"
      - ".github/workflows/deploy-shiguang-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config shiguang/worker/wrangler.toml
